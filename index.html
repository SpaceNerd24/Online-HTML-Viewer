<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online HTML Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/duotone-dark.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 99vh;
            margin: 0;
            padding: 0px;
            background-color: #1e1e1e;
            color: #ffffff;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 80%;
            height: 80%;
            max-height: 800px;
            background-color: #2e2e2e;
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
            gap: 20px;
        }
        .editor, .preview {
            width: 100%;
            height: 50%;
            padding: 10px;
            box-sizing: border-box;
        }
        .editor {
            border-bottom: 1px solid #444;
        }
        .CodeMirror {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            color: #ffffff;
            overflow: auto;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(1, 1, 1, 1.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .fullscreen-overlay iframe {
            width: 90%;
            height: 90%;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            padding: 10px;
            padding-right: 14px;
            padding-left: 14px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 15px;
        }
        .fullscreen-btn {
            background-color: black;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 15px;
            margin: 10px;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
        }
        .action-buttons button {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor">
            <textarea id="htmlInput" placeholder="Enter your HTML code here..."></textarea>
        </div>
        <div class="preview">
            <iframe id="htmlOutput"></iframe>
        </div>
        <div class="action-buttons">
            <button onclick="downloadFile()">Download</button>
            <button onclick="openInNewWindow()">Open in New Window</button>
            <button class="fullscreen-btn" onclick="openFullscreen()">Fullscreen</button>
        </div>
    </div>

    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <button class="close-btn" onclick="closeFullscreen()">X</button>
        <iframe id="fullscreenOutput"></iframe>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/htmlmixed/htmlmixed.min.js"></script>
    <script>
        const htmlInput = document.getElementById('htmlInput');
        const htmlOutput = document.getElementById('htmlOutput');
        const fullscreenOverlay = document.getElementById('fullscreenOverlay');
        const fullscreenOutput = document.getElementById('fullscreenOutput');

        const editor = CodeMirror.fromTextArea(htmlInput, {
            mode: 'htmlmixed',
            theme: 'duotone-dark',
            lineNumbers: true,
            autoCloseTags: true,
            matchBrackets: true
        });

        editor.on('change', () => {
            const htmlContent = editor.getValue();
            htmlOutput.srcdoc = htmlContent;
            fullscreenOutput.srcdoc = htmlContent;
        });

        editor.setValue('<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Online HTML Viewer</title>\n</head>\n<body>\n    <h1>Hello, World!</h1>\n</body>\n</html>');

        function openFullscreen() {
            fullscreenOverlay.style.display = 'flex';
        }

        function closeFullscreen() {
            fullscreenOverlay.style.display = 'none';
        }

        function downloadFile() {
            const htmlContent = editor.getValue();
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        function openInNewWindow() {
            const htmlContent = editor.getValue();
            const newWindow = window.open();
            newWindow.document.write(htmlContent);
            newWindow.document.close();
        }
    </script>
</body>
</html>
